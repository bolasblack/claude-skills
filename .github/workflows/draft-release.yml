          actual_body=$(gh release view "$TAG" --json body --jq .body)
          [ "$actual_body" = "$expected_body" ] || { echo "draft body differs from the reviewed release note" >&2; exit 1; }
          actual_title=$(gh release view "$TAG" --json name --jq .name)
          [ "$actual_title" = "$PROJECT $TAG" ] || { echo "draft title differs from the release contract" >&2; exit 1; }
          actual_prerelease=$(gh release view "$TAG" --json isPrerelease --jq .isPrerelease)
          [ "$actual_prerelease" = "$prerelease" ] || { echo "draft prerelease state differs from SemVer" >&2; exit 1; }
          actual=$(gh release view "$TAG" --json assets --jq ".assets[].name")
          [ -z "$actual" ] || { printf "source-only draft unexpectedly has assets:\n%s\n" "$actual" >&2; exit 1; }

  verify-guardrails:
    needs: select-component
    if: needs.select-component.outputs.component == 'guardrails'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          "python-version": "3.13"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          "bun-version": "1.3.14"
      - name: Verify release identity
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |-
          python3 .github/release/check.py --tagged --tag-prefix guardrails-v --version-file skills/guardrails/VERSION --branch-ref refs/remotes/origin/master "$TAG"
      - name: Test
        run: |-
          set -eu
          bun test skills/guardrails/scripts/guardrails.test.ts
          bash scripts/install.test.sh

  draft-guardrails:
    needs: verify-guardrails
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
      - name: Create a complete unpublished draft
        env:
          GH_TOKEN: ${{ github.token }}
          PROJECT: "guardrails"
          TAG: ${{ inputs.tag || github.ref_name }}
          TAG_PREFIX: "guardrails-v"
        run: |-
          set -eu
          version=${TAG#"$TAG_PREFIX"}
          version_without_build=${version%%+*}
          prerelease=false
          case "$version_without_build" in *-*) prerelease=true ;; esac
          if state=$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null); then
