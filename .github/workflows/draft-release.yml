          [ -z "$actual" ] || { printf "source-only draft unexpectedly has assets:\n%s\n" "$actual" >&2; exit 1; }

  verify-mcp-skill-generator:
    needs: select-component
    if: needs.select-component.outputs.component == 'mcp-skill-generator'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          "python-version": "3.13"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          "node-version": "24.20.0"
          "package-manager-cache": "false"
      - name: Verify release identity
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |-
          python3 .github/release/check.py --tagged --tag-prefix mcp-skill-generator-v --version-file skills/mcp-skill-generator/VERSION --branch-ref refs/remotes/origin/master "$TAG"
      - name: Test
        run: |-
          set -eu
          for script in skills/mcp-skill-generator/scripts/*.mjs; do
            node --check "$script"
          done
          node --input-type=module -e "await import('./skills/mcp-skill-generator/scripts/api.mjs')"
          bash scripts/install.test.sh

  draft-mcp-skill-generator:
    needs: verify-mcp-skill-generator
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
