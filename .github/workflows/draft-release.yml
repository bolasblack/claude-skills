          fetch-depth: 0
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
      - name: Create a complete unpublished draft
        env:
          GH_TOKEN: ${{ github.token }}
          PROJECT: "mcp-skill-generator"
          TAG: ${{ inputs.tag || github.ref_name }}
          TAG_PREFIX: "mcp-skill-generator-v"
